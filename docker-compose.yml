services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onlyfitness-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - public-data:/var/www/public
      - database-data:/var/www/database
      - storage-data:/var/www/storage
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      MAIL_MAILER: log
    networks:
      - onlyfitness

  nginx:
    image: nginx:1.27-alpine
    container_name: onlyfitness-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public-data:/var/www/public:ro
    depends_on:
      - app
    networks:
      - onlyfitness

networks:
  onlyfitness:
    driver: bridge

volumes:
  public-data:
  database-data:
  storage-data:
